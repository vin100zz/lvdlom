<body ng-controller="MainCtrl" ng-click="onClick($event)">

 <!-- Barre d'actualité : dernier match, matches à venir, nouvelle saisie -->
 <div id="header">

  <lvdlom-mini-loading ng-if="!actu"></lvdlom-mini-loading>

  <div class="actu" ng-if="actu">
   <span class="actu-label">Dernier match</span>
   <a href="#match/{{actu.dernierMatch.id}}" class="actu-dernier" aria-label="Dernier match : {{actu.dernierMatch.clubGauche}} {{actu.dernierMatch.butsGauche}} – {{actu.dernierMatch.butsDroite}} {{actu.dernierMatch.clubDroite}}">
    <img ng-if="actu.dernierMatch.ecussonGauche" ng-src="{{actu.dernierMatch.ecussonGauche}}" alt="">
    <span class="club">{{actu.dernierMatch.clubGauche}}</span>
    <span class="score">{{actu.dernierMatch.butsGauche}}<span class="dash" aria-hidden="true"></span>{{actu.dernierMatch.butsDroite}}</span>
    <span class="club">{{actu.dernierMatch.clubDroite}}</span>
    <img ng-if="actu.dernierMatch.ecussonDroite" ng-src="{{actu.dernierMatch.ecussonDroite}}" alt="">
   </a>
   <span class="actu-sep" aria-hidden="true"></span>
   <span class="actu-label">À venir</span>
   <span class="actu-prochain" ng-repeat="prochainMatch in actu.prochainsMatches track by $index">
    <img ng-if="prochainMatch.ecusson" ng-src="{{prochainMatch.ecusson}}" alt="">
    <span class="texte"><span class="match">{{prochainMatch.affiche || prochainMatch.match}}</span><span class="date">{{prochainMatch.dateCourte || prochainMatch.date}}</span></span>
   </span>
  </div>

  <a href="#/saisie/new" id="add-data" aria-label="Nouvelle saisie">
   <span class="fa fa-plus"></span>
  </a>
 </div>

 <!-- En-tête mobile -->
 <div id="mini-header">
  <span id="hamburger" class="fa fa-bars hamburger" role="button" tabindex="0" aria-label="Ouvrir le menu" ng-click="toggleMenu()"></span>
  <a href="#/anniversaire" class="logo"><img src="style/img/title.png" alt="La Vie de l'OM — accueil"></a>
  <a href="#/saisie/new" class="add" aria-label="Nouvelle saisie"><span class="fa fa-plus"></span></a>
 </div>

 <div id="content">
  <ng-view id="payload" ng-show="!loading"></ng-view>
 </div>

 <lvdlom-search cfg="searchCfg"></lvdlom-search>
 <lvdlom-menu cfg="menuCfg" search-cfg="searchCfg"></lvdlom-menu>

 <div id="mask" ng-show="loading">
  <div class="anim">
   <div class="outer-ball"></div>
   <div class="inner-ball"></div>
  </div>
 </div>

  <lvdlom-viewer></lvdlom-viewer>

  <div id="alert" role="status" ng-class="{show: alert.show, error: alert.type == 'error'}">
    <span class="fa fa-check status success" ng-if="alert.type == 'success'"></span>
    <span class="fa fa-exclamation status error" ng-if="alert.type == 'error'"></span>
    <span>{{alert.message}}</span>
    <span class="fa fa-times close" ng-click="closeAlert()"></span>
  </div>

</body>
