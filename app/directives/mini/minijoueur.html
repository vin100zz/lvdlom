<div ng-controller="MiniJoueurCtrl">

  <lvdlom-mini-loading ng-if="loading"></lvdlom-mini-loading>

  <div class="g-empty" ng-if="!loading && !joueur"><span class="fa fa-hand-pointer-o" aria-hidden="true"></span><b>Aucun joueur sélectionné</b><span>Cliquez sur une ligne du tableau pour afficher son détail ici.</span></div>
  
  <div ng-if="!loading && joueur">
    <lvdlom-fiche-joueur joueur="joueur" cfg="{mini: true}"></lvdlom-fiche-joueur>
  </div>
  
</div>
