  <lvdlom-mini-loading ng-if="loading"></lvdlom-mini-loading>

  <div class="g-empty" ng-if="!loading && !dirigeant"><span class="fa fa-hand-pointer-o" aria-hidden="true"></span><b>Aucun dirigeant sélectionné</b><span>Cliquez sur une ligne du tableau pour afficher son détail ici.</span></div>

  </div>
  
</div>
