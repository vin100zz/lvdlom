<div ng-controller="MiniMatchCtrl" id="minimatch">

  <lvdlom-mini-loading ng-if="loading"></lvdlom-mini-loading>

  <div class="g-empty" ng-if="!loading && !match"><span class="fa fa-hand-pointer-o" aria-hidden="true"></span><b>Aucun match sélectionné</b><span>Cliquez sur une ligne du tableau pour afficher son détail ici.</span></div>
  
  <div class="mini-match" ng-if="!loading && match">
    <lvdlom-fiche-match match="match" cfg="{mini: true}"></lvdlom-fiche-match>
    <lvdlom-equipe-match match="match" cfg="{mini: true}"></lvdlom-equipe-match>
  </div>
  

</div>
