<div class="dir-classement-match" ng-if="match.id">

  <ol>
    <li ng-repeat="row in classement" ng-class="{om: row.om, separator: row.separator}">
      <span class="pos">{{row.pos}}</span>
      <span class="club">{{row.club}}</span>
      <span class="buts" ng-if="row.buts" title="Buts marqués / encaissés">{{row.buts}}</span>
      <span class="pts">{{row.pts}} pt<span ng-if="row.pts > 1">s</span></span>
    </li>
  </ol>

  <p class="commentaire" ng-if="match.fiche.commentaire"><span class="fa fa-info-circle" aria-hidden="true"></span>{{match.fiche.commentaire}}</p>

</div>
