<div class="dir-buteurs-match" ng-if="match.id">

  <div class="maillots">
    <span class="maillot"><lvdlom-maillot cfg="left.maillot"></lvdlom-maillot></span>
    <span class="label">Buts</span>
    <span class="maillot"><lvdlom-maillot cfg="right.maillot"></lvdlom-maillot></span>
  </div>

  <!-- liste chronologique : buts à domicile à gauche, à l'extérieur à droite, score à chaque but -->
  <ol class="buts">
    <li ng-repeat="but in buts track by $index">
      <span class="side side-left">
        <span ng-if="but.left"><span class="minute">{{but.minuteTexte}}</span> <b ng-bind-html="but.nomHtml"></b> <span class="note" ng-if="but.noteTexte">{{but.noteTexte}}</span></span>
      </span>
      <span class="pill" ng-class="{om: !but.adv, vide: !but.score}" title="{{but.score ? 'Score : ' + but.score : ''}}">{{but.score}}</span>
      <span class="side side-right">
        <span ng-if="but.right"><span class="note" ng-if="but.noteTexte">{{but.noteTexte}}</span> <b ng-bind-html="but.nomHtml"></b> <span class="minute">{{but.minuteTexte}}</span></span>
      </span>
    </li>
    <li class="prolongation" ng-if="rq">
      <span class="label">{{rq}}</span>
      <span class="pill tab" ng-if="tab">{{tab}}</span>
      <span></span>
    </li>
  </ol>

  <p class="aucun" ng-if="!buts.length">Aucun but dans ce match.</p>

</div>
