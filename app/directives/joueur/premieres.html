<div class="dir-premieres-joueur" ng-if="joueur.id">

  <dl ng-if="premieres.length">
    <div ng-repeat="p in premieres">
      <dt>{{p.label}}<span class="date-mobile"> · {{p.date}}</span></dt>
      <dd>
        <span class="date">{{p.date}}</span>
        <span class="match"><span ng-bind-html="p.match.sousTypeCompetition | format:'sousTypeCompetition'"></span><a href="#/match/{{p.match.id}}">{{p.affiche}}</a></span>
        <span class="note">{{p.note}}</span>
      </dd>
    </div>
  </dl>

  <p class="aucun" ng-if="!premieres.length">Aucun match joué.</p>

</div>
