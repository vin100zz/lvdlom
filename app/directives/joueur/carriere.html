<div class="dir-carriere-joueur" ng-if="joueur.id">

  <ol ng-if="carriere.length">
    <li ng-repeat="row in carriere" ng-class="{om: row.om}">
      <span class="saison">{{row.saison}}</span>
      <span class="club">
        <img ng-if="row.om" ng-src="{{ecussonOm(row.saison)}}" alt="">
        <span class="nom">{{row.club}}</span>
        <span class="remarque" ng-if="row.remark">{{row.remark}}</span>
      </span>
    </li>
  </ol>

  <p class="aucun" ng-if="carrieres.$resolved && !carriere.length">Non renseignée</p>

</div>
