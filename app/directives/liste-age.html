<div class="dir-liste-age">

  <div class="g-squelette" ng-if="!joueurs.$resolved" aria-label="Chargement"><span ng-repeat="i in [1, 2, 3, 4, 5, 6]"></span></div>

  <ol class="g-carte-liste" ng-if="joueurs.$resolved && joueurs.length > 0">
    <li ng-repeat="joueur in joueurs">
      <span class="g-carte-ligne">
        <span class="rang">{{$index + 1}}</span>
        <span class="principal" ng-bind-html="Formatter.nomJoueur(joueur)"></span>
        <span class="valeur secondaire">{{Bom.age(joueur.age, true)}}</span>
      </span>
    </li>
  </ol>

  <p class="aucun" ng-if="joueurs.$resolved && !joueurs.length">Aucun joueur.</p>

</div>
