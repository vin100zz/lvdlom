<div class="modal-overlay" ng-if="isOpen" ng-click="close()">
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-label="{{title}}" ng-click="$event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">{{title}}</span>
      <button type="button" class="modal-close" ng-click="close()" aria-label="Fermer">
        <span class="fa fa-times"></span>
      </button>
    </div>
    <div class="modal-body" ng-transclude></div>
  </div>
</div>
