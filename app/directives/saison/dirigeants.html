<div class="dir-dirigeants-saison" ng-if="saison.id">

  <dl>
    <div ng-repeat="dirigeant in saison.dirigeants track by $index">
      <dt>{{dirigeant.titre}}</dt>
      <dd><a href="#/dirigeant/{{dirigeant.id}}">{{dirigeant.prenom}} <b>{{dirigeant.nom}}</b></a></dd>
      <dd class="dates" ng-if="dirigeant.debut">{{dates(dirigeant)}}</dd>
    </div>
  </dl>

</div>
