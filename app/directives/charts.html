<div class="dir-charts">

  <div ng-attr-id="{{uniqueId}}" class="canvases" ng-class="{'no-legend': cfg.hideLegend}">
    <canvas class="main" width="150" height="150" style="z-index: 1;"></canvas>
    <canvas class="inner" width="104" height="104" style="z-index: 2;"></canvas>
    <div class="center" ng-if="cfg.centerLabel || cfg.centerText"><b>{{cfg.centerText || total()}}</b><span>{{cfg.centerLabel}}</span></div>
  </div>
  <div class="legend" ng-if="!cfg.hideLegend">
    <ul>
      <li ng-repeat="data in mainData | reverse"><span class="icon" ng-style="{'background-color': data.color}"></span><b>{{data.value}}</b><span>{{data.label}}</span></li>
    </ul>
    <ul class="second" ng-if="innerData.length">
      <li ng-repeat="data in innerData | reverse"><span class="icon round" ng-style="{'background-color': data.color}"></span><b>{{data.value}}</b><span>{{data.label}}</span></li>
    </ul>
  </div>

</div>
