<div id="page-dirigeant" class="g-page g-fiche" ng-if="dirigeant.id">

  <div class="g-page-head">
    <lvdlom-breadcrumb cfg="breadcrumb"></lvdlom-breadcrumb>
    <lvdlom-fiche-dirigeant dirigeant="dirigeant"></lvdlom-fiche-dirigeant>
    <lvdlom-links links="links"></lvdlom-links>
  </div>

  <!-- fonctions · revue de presse -->
  <div class="fiche-body">

    <section class="dirigeant-col-fonctions" aria-labelledby="h-fonctions">
      <h2 class="g-title" id="h-fonctions">Fonctions</h2>
      <lvdlom-fonctions-dirigeant dirigeant="dirigeant"></lvdlom-fonctions-dirigeant>
    </section>

    <section class="dirigeant-col-presse" aria-labelledby="h-presse">
      <h2 class="g-title" id="h-presse">Revue de presse</h2>
      <lvdlom-documents documents="dirigeant.documents" cfg="{hauteur: 240}"></lvdlom-documents>
    </section>

  </div>

</div>
