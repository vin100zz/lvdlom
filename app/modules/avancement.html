<div id="page-avancement" class="g-page">

  <h1 class="g-page-title">Avancement</h1>

  <div class="g-squelette" ng-if="!avancements.length" aria-label="Chargement"><span ng-repeat="i in [1, 2, 3, 4]"></span></div>

  <div class="apercus" role="group" aria-label="Catégories">
    <button type="button" class="apercu" ng-repeat="avancement in avancements track by $index" ng-click="switchView($index)" ng-class="{actif: currentView == $index}" aria-pressed="{{currentView == $index}}">
      <span class="titre">{{avancement.title}}</span>
      <span class="anneaux">
        <span class="anneau">
          <lvdlom-charts cfg="avancement.chartCfg"></lvdlom-charts>
          <span class="legende">documents · {{avancement.nbDone}} / {{avancement.nbTotal}}</span>
        </span>
        <span class="anneau" ng-if="avancement.showIdData">
          <lvdlom-charts cfg="avancement.idChartCfg"></lvdlom-charts>
          <span class="legende">photos · {{avancement.nbIdDone}} / {{avancement.nbTotal}}</span>
        </span>
      </span>
    </button>
  </div>

  <section class="detail" ng-repeat="avancement in avancements track by $index" ng-if="currentView == $index" aria-labelledby="h-docs">
    <h2 class="g-title" id="h-docs">Documents · {{avancement.title}} <span class="g-title-extra"><span class="puce avec"></span>avec document <span class="puce sans"></span>sans</span></h2>
    <ul class="detail-completion">
      <li ng-repeat="(key, items) in avancement.groups">
        <span class="key">{{avancement.keyDisplayFn(key)}}</span>
        <span class="cases">
          <a ng-repeat="item in items track by item.id" ng-class="{'with-doc': item.nbDocs > 0}" href="#/{{avancement.link}}/{{item.id}}" tooltip="{{item.tooltip}}" tooltip-append-to-body="true" tooltip-class="g-tooltip" aria-label="{{item.tooltip}}">{{item.nbDocs || '–'}}</a>
        </span>
      </li>
    </ul>
  </section>

  <section class="detail" ng-repeat="avancement in avancements track by $index" ng-if="avancement.showIdData && currentView == $index" aria-labelledby="h-id">
    <h2 class="g-title" id="h-id">Photos d'identité · {{avancement.title}} <span class="g-title-extra"><span class="puce avec"></span>avec photo <span class="puce sans"></span>sans</span></h2>
    <ul class="detail-completion">
      <li ng-repeat="(key, items) in avancement.groups">
        <span class="key">{{avancement.keyDisplayFn(key)}}</span>
        <span class="cases">
          <a ng-repeat="item in items track by item.id" ng-class="{'with-doc': item.hasIdDoc}" href="#/{{avancement.link}}/{{item.id}}" tooltip="{{item.tooltip}}" tooltip-append-to-body="true" tooltip-class="g-tooltip" aria-label="{{item.tooltip}}">&nbsp;</a>
        </span>
      </li>
    </ul>
  </section>

</div>
