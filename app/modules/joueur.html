<div id="page-joueur" class="g-page g-fiche" ng-if="joueur.id">

  <div class="g-page-head">
    <lvdlom-breadcrumb cfg="breadcrumb"></lvdlom-breadcrumb>
    <lvdlom-fiche-joueur joueur="joueur"></lvdlom-fiche-joueur>
    <lvdlom-links links="links"></lvdlom-links>
  </div>

  <!-- statistiques et premières · palmarès et carrière · revue de presse -->
  <div class="fiche-body">

    <div class="fiche-col-principale">
      <section aria-labelledby="h-stats">
        <h2 class="g-title" id="h-stats">Statistiques</h2>
        <lvdlom-stats-joueur joueur="joueur"></lvdlom-stats-joueur>
      </section>
      <section aria-labelledby="h-premieres">
        <h2 class="g-title" id="h-premieres">Premières</h2>
        <lvdlom-premieres-joueur joueur="joueur"></lvdlom-premieres-joueur>
      </section>
    </div>

    <div class="fiche-col-secondaire">
      <section aria-labelledby="h-palmares">
        <h2 class="g-title" id="h-palmares">Palmarès</h2>
        <lvdlom-palmares-joueur joueur="joueur"></lvdlom-palmares-joueur>
      </section>
      <section aria-labelledby="h-carriere">
        <h2 class="g-title" id="h-carriere">Carrière</h2>
        <lvdlom-carriere-joueur joueur="joueur"></lvdlom-carriere-joueur>
      </section>
    </div>

    <section class="fiche-col-presse" aria-labelledby="h-presse">
      <h2 class="g-title" id="h-presse">Revue de presse</h2>
      <lvdlom-documents documents="joueur.documents" cfg="{hauteur: 240}"></lvdlom-documents>
    </section>

  </div>

  <!-- Biographie générée par IA -->
  <lvdlom-modal
    is-open="biographieVisible"
    title="Biographie — {{joueur.fiche.prenom}} {{joueur.fiche.nom}}"
    on-close="closeBiographie()">
    <lvdlom-biographie-joueur joueur="joueur"></lvdlom-biographie-joueur>
  </lvdlom-modal>

  <!-- Résumé des documents généré par IA -->
  <lvdlom-modal
    is-open="documentsResumeVisible"
    title="Documents — {{joueur.fiche.prenom}} {{joueur.fiche.nom}}"
    on-close="closeDocumentsResume()">
    <lvdlom-documents-resume-joueur joueur="joueur"></lvdlom-documents-resume-joueur>
  </lvdlom-modal>

</div>
