<meta charset="utf-8">

<div class="g-list">

  <!-- Titre + filtres -->
  <div class="g-list-head">
    <h1 class="g-page-title">{{pageTitle}}</h1>
    <lvdlom-filters cfg="filters"></lvdlom-filters>
  </div>

  <div class="g-list-body">

    <!-- Mobile : bilan compact au-dessus de la liste -->
    <section class="g-bilan-compact" ng-if="chartCfg" aria-label="{{chartTitle || 'Bilan'}}">
      <div class="barre" role="img" aria-label="{{bilanCompact().aria}}">
        <span ng-repeat="part in bilanCompact().parts" ng-style="{flex: part.n + ' 1 0', background: part.color}"></span>
      </div>
      <div class="legende">
        <span ng-repeat="part in bilanCompact().parts"><span class="puce" aria-hidden="true" ng-style="{background: part.color}"></span><b>{{part.n}}</b>{{part.label}}</span>
        <span class="buts" ng-if="bilanCompact().buts">{{bilanCompact().buts}}</span>
      </div>
    </section>

    <!-- Résultats -->
    <section class="g-list-results" aria-label="Résultats">
      <lvdlom-table cfg="tableCfg" lien="selectionLink"></lvdlom-table>
    </section>

    <!-- Panneau : bilan + sélection -->
    <div class="g-list-aside" ng-if="chartCfg || selectionTpl">
      <section class="g-block" ng-show="chartCfg != null">
        <div class="g-topbar">{{chartTitle || 'Stats'}}</div>
        <div>
          <lvdlom-charts cfg="chartCfg"></lvdlom-charts>
        </div>
      </section>

      <section class="g-block g-selection" ng-if="selectionTpl">
        <div class="g-topbar">Sélection</div>
        <div>
          <ng-include src="selectionTpl"></ng-include>
        </div>
        <div class="g-bottombar" ng-if="selectionLink && selected.id">
          <a href="{{selectionLink}}{{selected.id}}" class="fa fa-mail-forward g-link" aria-label="Voir la fiche"></a>
        </div>
      </section>
    </div>

  </div>

</div>
