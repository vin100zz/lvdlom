<div id="page-equipe-types" class="g-page">

  <h1 class="g-page-title">Équipe-types</h1>

  <div class="g-squelette-cartes" ng-if="!saisons.length">
    <div class="g-carte" ng-repeat="i in [1, 2, 3]"><div class="g-carte-corps"><div class="g-squelette"><span ng-repeat="j in [1, 2, 3, 4, 5, 6, 7, 8]"></span></div></div></div>
  </div>

  <ul class="g-cartes">
    <li class="g-carte" ng-repeat="saison in saisons">
      <div class="g-carte-tete"><h2>Équipe-type {{saison.id}}</h2><span class="meta">matches · buts</span></div>
      <div class="g-carte-corps">
        <div class="g-carte-entete" ng-if="saison.joueurs.length"><span class="poste"></span><span class="principal">Joueur</span><span class="valeur m" title="Matches">M</span><span class="valeur b" title="Buts">B</span></div>
        <p class="aucun" ng-if="!saison.joueurs.length">Aucun joueur renseigné.</p>
        <ol class="g-carte-liste" ng-if="saison.joueurs.length">
          <li ng-repeat="joueur in saison.joueurs">
            <span class="g-carte-ligne">
              <span ng-bind-html="joueur.poste | format:'poste'"></span>
              <span class="principal" ng-bind-html="Formatter.nomJoueur(joueur)"></span>
              <span class="valeur m">{{joueur.nbMatches}}</span>
              <span class="valeur b secondaire">{{joueur.nbButs || '–'}}</span>
            </span>
          </li>
        </ol>
      </div>
      <a class="g-carte-pied" href="#/saison/{{saison.id}}">Voir la saison {{saison.id}}
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </li>
  </ul>

</div>
