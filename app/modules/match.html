<div id="page-match" class="g-page" ng-if="match.id">

  <div class="g-page-head">
    <lvdlom-breadcrumb cfg="breadcrumb"></lvdlom-breadcrumb>
    <h1 class="g-sr-only">{{Formatter.matchTitle(match)}} {{Formatter.score(Formatter.$Score.big, match.fiche)}}</h1>
    <lvdlom-fiche-match match="match"></lvdlom-fiche-match>
  </div>

  <!-- buts et classement · composition · revue de presse -->
  <div class="match-body">

    <div class="match-col-buts">
      <section aria-labelledby="h-buts">
        <h2 class="g-title" id="h-buts">Buts</h2>
        <lvdlom-buteurs-match match="match"></lvdlom-buteurs-match>
      </section>
      <section aria-labelledby="h-classement" ng-if="match.fiche.class1">
        <h2 class="g-title" id="h-classement">Classement</h2>
        <lvdlom-classement-match match="match"></lvdlom-classement-match>
      </section>
    </div>

    <section class="match-col-compo" aria-labelledby="h-compo">
      <h2 class="g-title" id="h-compo">Composition</h2>
      <lvdlom-equipe-match match="match"></lvdlom-equipe-match>
    </section>

    <section class="match-col-presse" aria-labelledby="h-presse">
      <h2 class="g-title" id="h-presse">Revue de presse</h2>
      <lvdlom-documents documents="match.documents"></lvdlom-documents>
    </section>

  </div>

</div>
