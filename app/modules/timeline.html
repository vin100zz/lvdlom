<div id="page-timeline" class="g-page">

  <h1 class="g-page-title">Timeline</h1>

  <div class="g-squelette" ng-if="!saisons.length" aria-label="Chargement"><span ng-repeat="i in [1, 2, 3, 4, 5, 6, 7, 8]"></span></div>

  <!-- la frise défile dans son cadre, à la hauteur de l'écran : la barre de défilement horizontale reste visible -->
  <div class="defilement" ng-if="saisons.length">
    <div class="frise" ng-style="{width: largeur + 'px'}" lvdlom-frise-survol="{{COL}}" data-libelle="{{LIBELLE}}">

      <!-- séparations verticales entre saisons, la saison survolée en bleu ciel -->
      <div class="colonnes" aria-hidden="true">
        <span ng-repeat="colonne in colonnes track by colonne.id" ng-style="{left: colonne.left + 'px', width: COL + 'px'}"></span>
        <span class="survol" hidden></span>
      </div>

      <div class="rangee tete">
        <span class="libelle"></span>
        <a ng-repeat="colonne in colonnes track by colonne.id" class="saison" href="#/saison/{{colonne.id}}" ng-style="{left: colonne.left + 'px', width: COL + 'px'}">{{colonne.id}}</a>
      </div>

      <div class="rangee resultat">
        <span class="libelle">Championnat</span>
        <span ng-repeat="colonne in colonnes track by colonne.id" class="cellule" ng-style="{left: colonne.left + 'px', width: COL + 'px'}">
          <span class="pastille" ng-if="palmares.championnat[colonne.id]" ng-class="{titre: palmares.championnat[colonne.id].titre}">{{palmares.championnat[colonne.id].label}}</span>
          <span class="vide" ng-if="!palmares.championnat[colonne.id]">—</span>
        </span>
      </div>
      <div class="rangee resultat">
        <span class="libelle">Coupe de France</span>
        <span ng-repeat="colonne in colonnes track by colonne.id" class="cellule" ng-style="{left: colonne.left + 'px', width: COL + 'px'}">
          <span class="pastille" ng-if="palmares.coupeFrance[colonne.id]" ng-class="{titre: palmares.coupeFrance[colonne.id].titre}">{{palmares.coupeFrance[colonne.id].label}}</span>
          <span class="vide" ng-if="!palmares.coupeFrance[colonne.id]">—</span>
        </span>
      </div>
      <div class="rangee resultat">
        <span class="libelle">Coupe d'Europe</span>
        <span ng-repeat="colonne in colonnes track by colonne.id" class="cellule" ng-style="{left: colonne.left + 'px', width: COL + 'px'}">
          <span class="pastille" ng-if="palmares.coupeEurope[colonne.id]" ng-class="{titre: palmares.coupeEurope[colonne.id].titre}"><span ng-if="palmares.coupeEurope[colonne.id].badge" ng-bind-html="palmares.coupeEurope[colonne.id].badge | format:'sousTypeCompetition'"></span>{{palmares.coupeEurope[colonne.id].label}}</span>
          <span class="vide" ng-if="!palmares.coupeEurope[colonne.id]">—</span>
        </span>
      </div>

      <!-- présidents, entraîneurs, puis joueurs par poste ; un filet sépare chaque groupe -->
      <div class="groupe" ng-repeat="groupe in groupes">
        <div class="rangee barres" ng-repeat="ligne in groupe.lignes">
          <span class="libelle">{{$first ? groupe.nom : ''}}</span>
          <a ng-repeat="item in ligne" class="barre {{::item.style}}" href="{{::item.lien}}" ng-style="::item.position" aria-label="{{::item.titre}}"
             data-nom="{{::item.nomComplet}}" data-periode="{{::item.periode}}" data-stats="{{::item.stats}}">
            <span class="nom"><span ng-if="::item.prenomAffiche">{{::item.prenomAffiche}} </span><b>{{::item.nom}}</b></span>
            <span class="meta" ng-if="::item.meta">{{::item.meta}}</span>
          </a>
        </div>
      </div>

      <!-- infobulle des barres : nom complet, période, matches et buts -->
      <div class="infobulle" role="tooltip" hidden></div>

    </div>
  </div>

</div>
