<div id="page-series" class="g-page">

  <div class="g-list-head">
    <h1 class="g-page-title">Séries</h1>
    <lvdlom-filters cfg="filters"></lvdlom-filters>
  </div>

  <ul class="g-cartes">
    <li class="g-carte" ng-repeat="meta in metaData track by $index">
      <div class="g-carte-tete"><h2>{{meta.label}}</h2><span class="meta" ng-if="series.$resolved">{{series[meta.key].length}} match<span ng-if="series[meta.key].length > 1">es</span></span></div>
      <div class="g-carte-corps">
        <div class="g-squelette" ng-if="!series.$resolved" aria-label="Chargement"><span ng-repeat="i in [1, 2, 3, 4, 5]"></span></div>
        <ol class="g-carte-liste" ng-if="series.$resolved && series[meta.key].length">
          <li ng-repeat="match in series[meta.key] track by match.id">
            <span class="g-carte-ligne">
              <span class="date">{{Formatter.date(match.date)}}</span>
              <span ng-bind-html="Formatter.sousTypeCompetition(match.sousTypeCompetition)"></span>
              <span class="principal" ng-bind-html="Formatter.matchLink(match)"></span>
              <span class="valeur score" ng-bind-html="Formatter.score(Formatter.$Score.table, match)"></span>
            </span>
          </li>
        </ol>
        <p class="aucun" ng-if="series.$resolved && !series[meta.key].length">Aucune série.</p>
      </div>
    </li>
  </ul>

</div>
